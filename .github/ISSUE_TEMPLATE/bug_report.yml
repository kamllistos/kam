name: Bug report
description: kam crashed, errored or misbehaved (not a wrong finding)
title: "bug: "
labels: [bug, triage]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the command you ran and the full output.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: input
    id: version
    attributes:
      label: kam version
      description: Output of `kam version`
    validations:
      required: true
  - type: input
    id: terraform
    attributes:
      label: Terraform or OpenTofu version
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, WSL, macOS, Windows]

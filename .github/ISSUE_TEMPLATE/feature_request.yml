name: Feature request
description: Suggest a new rule, output format, cloud or integration
title: "feat: "
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to catch or do that kam can't today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like kam to do
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd like to work on this myself
